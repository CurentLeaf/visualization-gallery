name: Build and deploy visualization gallery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==2.2.3 matplotlib==3.9.2 missingno==0.5.2
      - uses: r-lib/actions/setup-r@v2
      - name: Install R visualization libraries
        run: Rscript -e 'install.packages(c("ggplot2","ggdist"), repos="https://cloud.r-project.org")'
      - run: python build.py
      - run: Rscript uncertainty.R
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
